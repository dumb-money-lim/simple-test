<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 생성기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <div class="container">
        <header>
            <h1>로또 번호 생성기</h1>
            <button id="theme-toggle" class="theme-btn">다크 모드</button>
        </header>
        
        <main>
            <div id="lotto-numbers" class="numbers-container">
                <div class="placeholder">행운의 번호를 생성해보세요!</div>
            </div>
            <button id="generate-btn" class="generate-btn">번호 생성하기</button>
        </main>
        
        <footer>
            <p>&copy; 2026 로또 생성기</p>
        </footer>
    </div>
    <script src="main.js"></script>
</body>
</html>
